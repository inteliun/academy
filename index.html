<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inteliun</title><link rel="stylesheet" href="style.css"></head><body><h1>Inteliun Academy</h1><p>Aprende, supera el examen y consigue tu insignia verificable.</p><div id="app"></div><script>const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));fetch('cursos/index.json').then(r=>r.json()).then(a=>{document.getElementById('app').innerHTML=a.map(c=>'<a class="card" href="curso.html?c='+E(c.id)+'"><h3>'+E(c.title)+'</h3><p>'+E(c.description)+'</p><small>'+c.tags.map(E).join(' · ')+'</small></a>').join('')})</script></body></html>
